name: ClipboardMac
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"

targets:
  ClipboardMac:
    type: application
    platform: macOS
    sources:
      - path: ClipboardMac
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ClipboardMac
        INFOPLIST_FILE: ClipboardMac/Info.plist
        PRODUCT_NAME: ClipboardMac
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: NO
    info:
      path: ClipboardMac/Info.plist
      properties:
        CFBundleName: ClipboardMac
        CFBundleDisplayName: ClipboardMac
        CFBundleIdentifier: com.example.ClipboardMac
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        CFBundlePackageType: APPL
        CFBundleExecutable: ClipboardMac
        LSMinimumSystemVersion: "13.0"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        LSApplicationCategoryType: public.app-category.utilities
